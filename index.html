<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portfólio de Imagens</title>
</head>
<body>

    <h1>Meu Portfólio Fotográfico</h1>

    <figure>
        <img src="../img/paisagem.jpg" alt="Foto de uma paisagem natural">
        <figcaption>Imagem 1: Paisagem natural tirada no outono.</figcaption>
    </figure>

    <figure>
        <img src="../img/cidade.jpg" alt="Foto de uma cidade à noite">
        <figcaption>Imagem 2: Vista urbana durante a noite.</figcaption>
    </figure>

    <figure>
        <img src="../img/tecnologia.jpg" alt="Foto de um computador em uma mesa">
        <figcaption>Imagem 3: Espaço de trabalho e tecnologia.</figcaption>
    </figure>

</body>
</html>
